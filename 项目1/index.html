<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>介绍页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
        }

        /* 左侧固定导航 */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #fff;
            box-shadow: 1px 0 6px rgba(0,0,0,0.05);
            position: fixed;
            padding-top: 40px;
        }
        .sidebar h3 {
            text-align: center;
            margin-bottom: 35px;
            color: #333;
        }
        .menu-item {
            display: block;
            width: 100%;
            padding: 13px 25px;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 15px;
            color: #666;
            cursor: pointer;
            transition: 0.25s;
        }
        .menu-item:hover,
        .menu-item.active {
            background-color: #f0f4ff;
            color: #1967d2;
            border-right: 4px solid #1967d2;
        }

        /* 右侧主内容 */
        .content-wrap {
            margin-left: 220px;
            flex: 1;
            padding: 40px 50px;
        }
        .content-box {
            background: #fff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: none;
        }
        .content-box.show {
            display: block;
        }
        .content-box h2 {
            margin-bottom: 20px;
            color: #222;
        }
        .content-box p {
            line-height: 1.8;
            color: #555;
            font-size: 15px;
        }
    </style>
</head>
<body>

<!-- 左侧导航 按钮切换 -->
<div class="sidebar">
    <h3>导航目录</h3>
    <button class="menu-item active" data-target="page1">项目简介</button>
    <button class="menu-item" data-target="page2">背景介绍</button>
    <button class="menu-item" data-target="page3">核心功能</button>
    <button class="menu-item" data-target="page4">技术说明</button>
    <button class="menu-item" data-target="page5">团队与总结</button>
</div>

<!-- 右侧内容 局部切换 不改网址 -->
<div class="content-wrap">
    <div id="page1" class="content-box show">
        <h2>项目简介</h2>
        <p>在这里填写你的项目介绍、作品说明、整体概述等内容。</p>
    </div>

    <div id="page2" class="content-box">
        <h2>背景介绍</h2>
        <p>填写项目开发背景、现实需求、解决了什么问题、应用场景。</p>
    </div>

    <div id="page3" class="content-box">
        <h2>核心功能</h2>
        <p>介绍系统各个模块、功能亮点、特色设计、优势特点。</p>
    </div>

    <div id="page4" class="content-box">
        <h2>技术说明</h2>
        <p>使用技术：HTML / CSS / JavaScript、框架、数据库、服务器等。</p>
    </div>

    <div id="page5" class="content-box">
        <h2>团队与总结</h2>
        <p>团队分工、项目收获、存在不足、未来优化方向。</p>
    </div>
</div>

<script>
    // 核心：点击切换内容，【网址不变、不刷新、不跳转】
    const items = document.querySelectorAll('.menu-item');
    const pages = document.querySelectorAll('.content-box');

    items.forEach(item => {
        item.addEventListener('click', () => {
            // 取消所有选中
            items.forEach(i => i.classList.remove('active'));
            // 当前按钮选中
            item.classList.add('active');

            // 隐藏所有内容
            pages.forEach(p => p.classList.remove('show'));
            // 显示对应内容
            const target = item.getAttribute('data-target');
            document.getElementById(target).classList.add('show');
        })
    })
</script>

</body>
</html>
